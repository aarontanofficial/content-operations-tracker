
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Hunter | Character</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  color: #eaf8ff;
  background: #030711;
  font-family: Arial, sans-serif;
}

#viewer {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at 50% 45%,
    #102747 0%,
    #07101f 45%,
    #030711 80%
  );
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.panel {
  position: fixed;
  z-index: 2;
  top: 20px;
  left: 16px;
  padding: 18px;
  width: min(500px, calc(100vw - 32px));
  max-height: 45vh;
  overflow-y: auto;
  border: 1px solid #53cfff45;
  border-radius: 20px;
  background: #071323d9;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 30px #008cff12;
}

h1 {
  margin: 0 0 8px;
  color: #73e4ff;
  font-size: 25px;
  letter-spacing: 3px;
}

.subtitle {
  color: #9db9d2;
  font-size: 15px;
}

#status {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.6;
  color: #68e5ff;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

button {
  flex: 1;
  min-height: 48px;
  padding: 12px 8px;
  border: 1px solid #43bfff66;
  border-radius: 12px;
  background: #102944;
  color: #eaf8ff;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  background: #17446a;
}

.hint {
  position: fixed;
  z-index: 2;
  bottom: 24px;
  left: 0;
  right: 0;
  padding: 0 12px;
  text-align: center;
  color: #b8d9ed;
  font-size: 14px;
  pointer-events: none;
  text-shadow: 0 1px 8px #000;
}

@media (max-width: 480px) {
  .panel {
    top: 16px;
    left: 14px;
    width: calc(100vw - 28px);
    padding: 18px;
  }

  h1 {
    font-size: 23px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="viewer"></div>

<div class="panel">
  <h1>SHADOW HUNTER</h1>
  <div class="subtitle">AWAKEN YOUR TRUE FORM</div>

  <div id="status">Loading character...</div>

  <div class="controls">
    <button id="spin">Pause rotation</button>
    <button id="reset">Reset view</button>
  </div>
</div>

<div class="hint">DRAG TO ROTATE · PINCH TO ZOOM</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const spinButton = document.getElementById("spin");
const resetButton = document.getElementById("reset");

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color("#030711");

// Camera
const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 0.4, 4.5);

// Renderer
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: "low-power"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

viewer.appendChild(renderer.domElement);

// Lighting
scene.add(
  new THREE.HemisphereLight(0xbdeaff, 0x101020, 2.0)
);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);

const blueLight = new THREE.PointLight(0x168bff, 30, 15);
blueLight.position.set(2, 1, 3);
scene.add(blueLight);

const rimLight = new THREE.PointLight(0x00eaff, 35, 15);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

// Camera controls
const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.enableZoom = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.85;

let userPaused = false;
let idleTimer;

function updateSpinButton() {
  spinButton.textContent = userPaused
    ? "Resume rotation"
    : "Pause rotation";
}

controls.addEventListener("start", () => {
  controls.autoRotate = false;
  clearTimeout(idleTimer);
});

controls.addEventListener("end", () => {
  clearTimeout(idleTimer);

  idleTimer = setTimeout(() => {
    if (!userPaused) {
      controls.autoRotate = true;
    }
  }, 2500);
});

spinButton.addEventListener("click", () => {
  userPaused = !userPaused;

  clearTimeout(idleTimer);
  controls.autoRotate = !userPaused;

  updateSpinButton();
});

// Reset camera
resetButton.addEventListener("click", () => {
  controls.reset();
  clearTimeout(idleTimer);

  if (!userPaused) {
    controls.autoRotate = true;
  }
});

// Load character
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(
  "./shadow-hunter.glb",

  (gltf) => {
    const model = gltf.scene;

    // Inspect character meshes once
    const meshNames = [];

    model.traverse((obj) => {
      if (obj.isMesh) {
        meshNames.push(obj.name || "(unnamed mesh)");
      }
    });

    console.log("Character meshes:", meshNames);

    // Center the model
    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    model.position.sub(center);

    // Fit character in viewer
    const largest = Math.max(size.x, size.y, size.z);

    if (largest > 0) {
      model.scale.multiplyScalar(2.5 / largest);
    }

    scene.add(model);

    // Set initial camera view
    controls.target.set(0, 0, 0);
    camera.position.set(0, 0.4, 4.5);

    controls.update();
    controls.saveState();

    // Show mesh information on screen
    status.style.whiteSpace = "pre-wrap";
    status.style.overflowWrap = "anywhere";

    status.textContent =
      "CHARACTER ONLINE\n" +
      "Meshes: " + meshNames.length + "\n" +
      (meshNames.length > 0
        ? meshNames.slice(0, 12).join("\n")
        : "No mesh objects found");
  },

  (event) => {
    if (event.total > 0) {
      const percent = Math.round(
        (event.loaded / event.total) * 100
      );

      status.textContent =
        "Loading character... " + percent + "%";
    }
  },

  (error) => {
    console.error("GLB loading error:", error);

    status.textContent =
      "MODEL FAILED TO LOAD\n" +
      "Check that shadow-hunter.glb exists in the repository, then refresh.";
  }
);

// Resize viewer
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

// Animation loop
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

updateSpinButton();
</script>

</body>
</html>
