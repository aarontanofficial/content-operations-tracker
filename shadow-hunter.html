
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Hunter | Character</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  color: #eaf8ff;
  background: #030711;
  font-family: Arial, sans-serif;
}

#viewer {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 45%, #102747 0%, #07101f 45%, #030711 80%);
}

canvas { display: block; touch-action: none; }

.panel {
  position: fixed;
  z-index: 2;
  top: 20px;
  left: 16px;
  padding: 15px 18px;
  width: min(290px, calc(100vw - 32px));
  border: 1px solid #53cfff45;
  border-radius: 16px;
  background: #071323c9;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 30px #008cff12;
}

h1 {
  margin: 0 0 5px;
  color: #73e4ff;
  font-size: 19px;
  letter-spacing: 2px;
}

.subtitle {
  color: #9db9d2;
  font-size: 12px;
}

#status {
  margin-top: 12px;
  font-size: 12px;
  color: #68e5ff;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

button {
  flex: 1;
  padding: 10px 8px;
  border: 1px solid #43bfff55;
  border-radius: 9px;
  background: #102944;
  color: #eaf8ff;
  font-size: 12px;
  cursor: pointer;
}

button:active { background: #17446a; }

.hint {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  color: #b8d9ed;
  font-size: 12px;
  pointer-events: none;
  text-shadow: 0 1px 8px #000;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="viewer"></div>

<div class="panel">
  <h1>SHADOW HUNTER</h1>
  <div class="subtitle">AWAKEN YOUR TRUE FORM</div>
  <div id="status">Loading character...</div>

  <div class="controls">
    <button id="spin">Pause rotation</button>
    <button id="reset">Reset view</button>
  </div>
</div>

<div class="hint">DRAG TO ROTATE · PINCH TO ZOOM</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const spinButton = document.getElementById("spin");
const resetButton = document.getElementById("reset");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#030711");

const camera = new THREE.PerspectiveCamera(
  38, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(0, 0.5, 4.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: "low-power"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
viewer.appendChild(renderer.domElement);

// Lightweight atmospheric lighting
scene.add(new THREE.HemisphereLight(0xbdeaff, 0x101020, 2.0));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);

const blueLight = new THREE.PointLight(0x168bff, 30, 15);
blueLight.position.set(2, 1, 3);
scene.add(blueLight);

const rimLight = new THREE.PointLight(0x00eaff, 35, 15);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.enableZoom = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.85;

let userPaused = false;
let idleTimer;

function updateSpinButton() {
  spinButton.textContent = userPaused
    ? "Resume rotation"
    : "Pause rotation";
}

controls.addEventListener("start", () => {
  controls.autoRotate = false;
  clearTimeout(idleTimer);
});

controls.addEventListener("end", () => {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!userPaused) controls.autoRotate = true;
  }, 2500);
});

spinButton.addEventListener("click", () => {
  userPaused = !userPaused;
  clearTimeout(idleTimer);
  controls.autoRotate = !userPaused;
  updateSpinButton();
});

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(
  "./shadow-hunter.glb",
  (gltf) => {
    const model = gltf.scene;

    // Center and fit the character
    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    model.position.sub(center);

    const largest = Math.max(size.x, size.y, size.z);
    if (largest > 0) model.scale.multiplyScalar(2.5 / largest);

    scene.add(model);

    controls.target.set(0, 0, 0);
    camera.position.set(0, 0.4, 4.5);
    controls.update();
    controls.saveState();

    status.textContent = "◆ CHARACTER ONLINE";
  },
  (event) => {
    if (event.total > 0) {
      const percent = Math.round(event.loaded / event.total * 100);
      status.textContent = "Loading character... " + percent + "%";
    }
  },
  (error) => {
    console.error("GLB loading error:", error);
    status.textContent = "Model failed to load. Refresh to retry.";
  }
);

resetButton.addEventListener("click", () => {
  controls.reset();
  clearTimeout(idleTimer);
  if (!userPaused) controls.autoRotate = true;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

updateSpinButton();
</script>
</body>
</html>
